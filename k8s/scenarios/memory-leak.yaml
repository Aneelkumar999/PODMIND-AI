apiVersion: v1
kind: Pod
metadata:
  name: memory-leak-pod
  labels:
    app: memory-leak
spec:
  containers:
  - name: stress-ng
    image: alexeiled/stress-ng
    args: ["--vm", "1", "--vm-bytes", "512M", "--vm-hang", "0", "--timeout", "600s"]
    resources:
      requests:
        memory: "64Mi"
      limits:
        memory: "256Mi"
